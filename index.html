<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой Медиа Трекер</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--inp:#222;--bd:#333;--ac:#6200ea;--ach:#7c4dff;--mu:#aaa}
*{box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px}
#authScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;text-align:center;gap:20px}
#appScreen{display:none}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--bd);padding-bottom:15px;margin-bottom:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row2{display:flex;gap:10px}.row2>*{flex:1}
input,select,textarea{padding:9px;background:var(--inp);border:1px solid #444;color:#fff;border-radius:4px;font-family:inherit;min-width:0}
textarea{resize:vertical;min-height:80px}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 15px;cursor:pointer;border-radius:4px;font-weight:bold}
.btn:hover{background:var(--ach)}
.btn-s{background:#333}.btn-s:hover{background:#444}
.btn-d{background:#cf6679;color:#000}.btn-d:hover{background:#ff758c}
.btn-g{background:#4285F4;font-size:16px;padding:12px 20px}.btn-g:hover{background:#3367D6}
#searchInput{flex:1;max-width:300px;min-width:140px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 5px}
.fb{background:#2a2a2a;color:#fff;border:1px solid #444;padding:6px 12px;border-radius:20px;cursor:pointer}
.fb.on{background:var(--ac);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;margin-top:20px}
.msg{color:#777;grid-column:1/-1}
.card{background:var(--card);border-radius:8px;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,.5);display:flex;flex-direction:column;cursor:pointer;transition:transform .2s;border:1px solid transparent}
.card:hover{transform:scale(1.02);border-color:var(--ac)}
.pc{position:relative;width:100%;padding-top:140%;background:#2c2c2c}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ci{padding:12px;display:flex;flex-direction:column;flex-grow:1}
.title{font-size:16px;font-weight:bold;margin:0 0 5px;line-height:1.2}
.meta{font-size:12px;color:var(--mu);margin-bottom:8px}
.status{align-self:flex-start;background:#03dac6;color:#000;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:bold;margin-bottom:8px}
.ratings{font-size:13px;color:#ff9800;margin-top:auto;line-height:1.5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:1000;padding:10px}
.mc{background:var(--card);padding:20px;border-radius:8px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;border:1px solid var(--bd)}
.mb{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
#detailPoster{width:100%;max-height:400px;object-fit:contain;background:#111;border-radius:4px}
#detailDescription{font-size:14px;line-height:1.5;color:#ccc;background:#222;padding:12px;border-radius:4px;white-space:pre-wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#2a2a2a;border:1px solid #444;color:#ddd;border-radius:12px;padding:3px 10px;font-size:12px;cursor:pointer}
.af{background:#191919;border:1px dashed #444;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
#afResults{max-height:230px;overflow-y:auto}
.afr{display:flex;gap:10px;align-items:center;padding:6px;border-radius:4px;cursor:pointer}
.afr:hover{background:#2a2a2a}
.afr img{width:40px;height:56px;object-fit:cover;border-radius:3px;background:#2c2c2c}
#posterPreview{height:70px;border-radius:4px;background:#2c2c2c}
.bar{height:8px;background:var(--ac);border-radius:4px}
.sr{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
#importFile{display:none}
@media(max-width:600px){.hdr-actions{width:100%;justify-content:space-between}}
</style>
</head>
<body>

<div id="authScreen">
  <h1>Мой Медиа Трекер</h1>
  <p style="color:var(--mu)">Войдите под своим аккаунтом Google, чтобы синхронизировать коллекцию</p>
  <button class="btn btn-g" id="loginBtn">Войти через Google</button>
</div>

<div id="appScreen">
  <header>
    <div class="row"><h1 style="margin:0;font-size:24px">Моя Коллекция</h1><span id="userEmail" class="meta" style="margin:0"></span></div>
    <div class="row hdr-actions">
      <button class="btn btn-s" id="statsBtn">📊 Статистика</button>
      <button class="btn btn-s" onclick="exportData()">⬇ Бэкап</button>
      <button class="btn btn-s" onclick="importFile.click()">⬆ Загрузить</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(event)">
      <button class="btn" id="openModalBtn">+ Добавить</button>
      <button class="btn btn-d" id="logoutBtn">Выход</button>
    </div>
  </header>

  <div class="row">
    <input type="text" id="searchInput" placeholder="Поиск по любому названию...">
    <select id="statusFilter">
      <option value="Все">Все статусы</option><option>В планах</option><option>Смотрю/Читаю</option>
      <option>Просмотрено/Прочитано</option><option>Любимое</option><option>Пересматриваю</option><option>Брошено</option>
    </select>
    <select id="tagFilter"><option value="Все">Все жанры и теги</option></select>
    <select id="sortSelect">
      <option value="dateDesc">Сначала новые</option>
      <option value="dateAsc">Сначала старые</option>
      <option value="titleAsc">По алфавиту (А-Я)</option>
      <option value="ratingDesc">По моей оценке</option>
      <option value="extDesc">По внешней оценке</option>
      <option value="yearDesc">По году (новые)</option>
    </select>
  </div>

  <div class="filters" id="catFilters">
    <button class="fb on" data-c="Всё">Всё</button><button class="fb" data-c="Фильм">Фильмы</button>
    <button class="fb" data-c="Сериал">Сериалы</button><button class="fb" data-c="Аниме">Аниме</button>
    <button class="fb" data-c="Манга">Манга</button><button class="fb" data-c="Манхва">Манхва</button>
    <button class="fb" data-c="Ранобэ">Ранобэ</button><button class="fb" data-c="Мультфильм">Мультфильмы</button>
  </div>
  <div class="grid" id="itemsGrid"></div>
</div>

<!-- Добавление / редактирование -->
<div class="modal" id="addModal"><div class="mc">
  <h3 id="formTitle" style="margin:0">Добавить тайтл</h3>
  <input type="hidden" id="editId">
  <div class="row2">
    <select id="inputCategory"><option>Фильм</option><option>Сериал</option><option>Аниме</option><option>Манга</option><option>Манхва</option><option>Ранобэ</option><option>Мультфильм</option></select>
    <select id="inputStatus"><option>В планах</option><option>Смотрю/Читаю</option><option>Просмотрено/Прочитано</option><option>Любимое</option><option>Пересматриваю</option><option>Брошено</option></select>
  </div>
  <div class="af">
    <div class="row"><input id="afQuery" placeholder="Автозаполнение: введи название..." style="flex:1"><button class="btn btn-s" id="afBtn" type="button">Найти</button></div>
    <div class="meta" id="afHint" style="margin:0"></div>
    <div id="afResults"></div>
  </div>
  <input type="text" id="inputTitle" placeholder="Название (русское) *">
  <div class="row2"><input id="inputTitleEn" placeholder="Английское"><input id="inputTitleOrig" placeholder="Оригинальное"></div>
  <input id="inputAlt" placeholder="Другие названия (через запятую)">
  <div class="row"><img id="posterPreview" alt=""><div style="flex:1;display:flex;flex-direction:column;gap:8px">
    <input id="inputPoster" placeholder="Ссылка на постер (URL)">
    <div class="row"><input type="file" id="inputPosterFile" accept="image/*" style="flex:1"><button class="btn btn-s" id="clearPoster" type="button">Убрать</button></div>
  </div></div>
  <div class="row2"><input type="number" id="inputYear" placeholder="Год" min="1900" max="2100"><input type="number" id="inputRating" placeholder="Моя оценка (1-10)" min="1" max="10"></div>
  <input type="number" id="inputExtRating" placeholder="Оценка Shikimori/IMDb (напр. 8.54)" min="0" max="10" step="0.01">
  <input id="inputTags" placeholder="Жанры и теги (через запятую)">
  <textarea id="inputDescription" placeholder="Синопсис / Описание..."></textarea>
  <div class="mb" style="justify-content:flex-end">
    <button class="btn btn-s" id="closeAddBtn" type="button">Отмена</button>
    <button class="btn" id="saveItemBtn" type="button">Сохранить</button>
  </div>
</div></div>

<!-- Подробности -->
<div class="modal" id="detailModal"><div class="mc">
  <img id="detailPoster" alt="Постер">
  <div class="mb" style="margin:0;align-items:center"><div class="status" id="detailStatus" style="margin:0"></div><div class="meta" id="detailMeta" style="margin:0"></div></div>
  <h2 id="detailTitle" style="margin:6px 0 0"></h2>
  <div class="meta" id="detailNames" style="margin:0"></div>
  <div class="ratings" id="detailRating" style="font-size:15px"></div>
  <div class="chips" id="detailTags"></div>
  <div id="detailDescription"></div>
  <div class="mb">
    <button class="btn btn-d" id="deleteItemBtn">Удалить</button>
    <div class="row"><button class="btn" id="editItemBtn">Редактировать</button><button class="btn btn-s" id="closeDetailBtn">Закрыть</button></div>
  </div>
</div></div>

<!-- Статистика -->
<div class="modal" id="statsModal"><div class="mc">
  <h3 style="margin:0">Статистика (по внешним оценкам)</h3>
  <div id="statsBody"></div>
  <div class="mb" style="justify-content:flex-end"><button class="btn btn-s" id="closeStatsBtn">Закрыть</button></div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,signInWithPopup,signInWithRedirect,GoogleAuthProvider,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,query,where,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// Ключ TMDB (для поиска фильмов и сериалов). Можно оставить пустым — сайт сам спросит при первом поиске.
const TMDB_KEY = "";

const app = initializeApp({
  apiKey: "AIzaSyCBBC6gBLvCV7Jx1C8NaMheXwqqKPvpnt8",
  authDomain: "mymediatracker-6e179.firebaseapp.com",
  projectId: "mymediatracker-6e179",
  storageBucket: "mymediatracker-6e179.firebasestorage.app",
  messagingSenderId: "642718397694",
  appId: "1:642718397694:web:7a4e175ed593cc364961af",
  measurementId: "G-NKNYFSP981"
});
const auth = getAuth(app), db = getFirestore(app), provider = new GoogleAuthProvider();

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const CATS = ['Фильм','Сериал','Аниме','Манга','Манхва','Ранобэ','Мультфильм'];
const STATS = ['В планах','Смотрю/Читаю','Просмотрено/Прочитано','Любимое','Пересматриваю','Брошено'];
const FALL = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280"><rect width="200" height="280" fill="%232c2c2c"/><text x="50%" y="50%" fill="%23777" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle">Нет постера</text></svg>';

let user = null, items = [], loaded = false, cat = 'Всё', curId = null, unsub = null, posterValue = '';
const grid = $('itemsGrid');

// ---------- Вход ----------
$('loginBtn').onclick = () => signInWithPopup(auth, provider).catch(e => {
  if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) return signInWithRedirect(auth, provider);
  if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code))
    alert('Ошибка входа: ' + e.message + '\nЕсли открыл ссылку из Telegram или другого приложения — открой сайт в обычном браузере.');
});
$('logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  user = u;
  if (u) {
    $('authScreen').style.display = 'none'; $('appScreen').style.display = 'block'; $('userEmail').textContent = u.email;
    loaded = false; render();
    // Живая синхронизация: изменения с другого устройства появляются сами
    unsub = onSnapshot(query(collection(db, 'items'), where('userId', '==', u.uid)),
      snap => { items = snap.docs.map(d => d.data()); loaded = true; refresh(); },
      err => alert('Не удалось загрузить данные: ' + err.message));
  } else {
    if (unsub) unsub(); unsub = null; items = []; loaded = false;
    $('appScreen').style.display = 'none'; $('authScreen').style.display = 'flex';
  }
});

const cloudSave = it => setDoc(doc(db, 'items', String(it.id)), {...it, userId: user.uid}).catch(e => alert('Не удалось сохранить в облако: ' + e.message));

// ---------- Отрисовка ----------
const names = i => [i.title, i.titleEn, i.titleOrig, i.alt].join(' ').toLowerCase();
const num = v => parseFloat(v) || 0;

function refresh() { refreshTags(); render(); }

function refreshTags() {
  const sel = $('tagFilter'), old = sel.value, map = new Map();
  items.forEach(i => (i.tags || []).forEach(t => { if (!map.has(t.toLowerCase())) map.set(t.toLowerCase(), t); }));
  sel.replaceChildren(new Option('Все жанры и теги', 'Все'));
  [...map].sort((a, b) => a[1].localeCompare(b[1])).forEach(([k, v]) => sel.add(new Option(v, k)));
  sel.value = map.has(old) ? old : 'Все';
}

function render() {
  grid.replaceChildren();
  if (!loaded) return grid.append(el('div', 'msg', 'Загрузка...'));
  if (!items.length) return grid.append(el('div', 'msg', 'Коллекция пуста. Нажми «+ Добавить».'));
  const q = $('searchInput').value.toLowerCase().trim(), st = $('statusFilter').value, tg = $('tagFilter').value, so = $('sortSelect').value;
  const list = items.filter(i =>
    (!q || names(i).includes(q)) && (cat === 'Всё' || i.category === cat) && (st === 'Все' || i.status === st) &&
    (tg === 'Все' || (i.tags || []).some(t => t.toLowerCase() === tg))
  ).sort((a, b) => {
    if (so === 'dateAsc') return a.id - b.id;
    if (so === 'titleAsc') return a.title.localeCompare(b.title);
    if (so === 'ratingDesc') return num(b.rating) - num(a.rating);
    if (so === 'extDesc') return num(b.extRating) - num(a.extRating);
    if (so === 'yearDesc') return num(b.year) - num(a.year);
    return b.id - a.id;
  });
  if (!list.length) return grid.append(el('div', 'msg', 'Ничего не найдено.'));
  list.forEach(i => {
    const card = el('div', 'card'), pc = el('div', 'pc'), img = el('img');
    img.loading = 'lazy'; img.src = i.poster || FALL; img.onerror = () => { img.onerror = null; img.src = FALL; };
    pc.append(img);
    const info = el('div', 'ci');
    info.append(el('div', 'status', i.status), el('h3', 'title', i.title),
      el('div', 'meta', `${i.category} • ${i.year || 'Год не указан'}`),
      el('div', 'ratings', `★ Моя: ${i.rating ? i.rating + '/10' : '-'}${i.extRating ? ' | Внешняя: ' + i.extRating : ''}`));
    card.append(pc, info); card.onclick = () => openDetail(i.id); grid.append(card);
  });
}
['input'].forEach(ev => $('searchInput').addEventListener(ev, render));
['statusFilter', 'tagFilter', 'sortSelect'].forEach(id => $(id).addEventListener('change', render));
document.querySelectorAll('.fb').forEach(b => b.onclick = () => {
  document.querySelectorAll('.fb').forEach(x => x.classList.remove('on')); b.classList.add('on'); cat = b.dataset.c; render();
});

// ---------- Окна ----------
const closeAll = () => ['addModal', 'detailModal', 'statsModal'].forEach(id => $(id).style.display = 'none');
['closeAddBtn', 'closeDetailBtn', 'closeStatsBtn'].forEach(id => $(id).onclick = closeAll);
window.onclick = e => { if (e.target.classList.contains('modal')) closeAll(); };
window.onkeydown = e => { if (e.key === 'Escape') closeAll(); };

function setPoster(v) {
  posterValue = v || ''; const data = posterValue.startsWith('data:');
  $('inputPoster').value = data ? '' : posterValue;
  $('inputPoster').placeholder = data ? 'Загружен свой файл ✓' : 'Ссылка на постер (URL)';
  $('posterPreview').src = posterValue || FALL;
}
$('inputPoster').oninput = () => { posterValue = $('inputPoster').value.trim(); $('posterPreview').src = posterValue || FALL; };
$('clearPoster').onclick = () => setPoster('');
$('inputPosterFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const w = Math.min(360, img.width), h = Math.round(img.height * w / img.width), c = document.createElement('canvas');
    c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    setPoster(c.toDataURL('image/jpeg', .75)); URL.revokeObjectURL(url);
  };
  img.onerror = () => alert('Не удалось прочитать картинку.');
  img.src = url; e.target.value = '';
};

const parseTags = s => { const seen = new Set(); return s.split(',').map(t => t.trim()).filter(t => t && !seen.has(t.toLowerCase()) && seen.add(t.toLowerCase())); };

function afHint() {
  const c = $('inputCategory').value;
  $('afHint').textContent = c === 'Аниме' || ['Манга', 'Манхва', 'Ранобэ'].includes(c)
    ? 'Ищет в AniList: вводи английское или японское (ромадзи) название.'
    : 'Ищет в TMDB: подойдёт русское или английское название.';
}
$('inputCategory').onchange = afHint;

function openAdd(item) {
  $('formTitle').textContent = item ? 'Редактировать тайтл' : 'Добавить тайтл';
  const i = item || {id: '', title: '', category: 'Фильм', status: 'В планах', year: '', rating: '', extRating: '', description: '', titleEn: '', titleOrig: '', alt: '', tags: []};
  $('editId').value = i.id; $('inputTitle').value = i.title; $('inputCategory').value = i.category; $('inputStatus').value = i.status;
  $('inputYear').value = i.year || ''; $('inputRating').value = i.rating || ''; $('inputExtRating').value = i.extRating || '';
  $('inputDescription').value = i.description || ''; $('inputTitleEn').value = i.titleEn || ''; $('inputTitleOrig').value = i.titleOrig || '';
  $('inputAlt').value = i.alt || ''; $('inputTags').value = (i.tags || []).join(', ');
  $('afQuery').value = ''; $('afResults').replaceChildren(); setPoster(i.poster); afHint();
  $('addModal').style.display = 'flex';
}
$('openModalBtn').onclick = () => openAdd(null);

$('saveItemBtn').onclick = () => {
  const title = $('inputTitle').value.trim(), year = $('inputYear').value, editId = $('editId').value;
  if (!title) return alert('Название обязательно!');
  if (year && (year < 1900 || year > 2100)) return alert('Год должен быть между 1900 и 2100');
  const category = $('inputCategory').value;
  if (!editId && items.some(i => i.title.toLowerCase() === title.toLowerCase() && i.category === category) &&
      !confirm('Такой тайтл уже есть в коллекции. Всё равно добавить?')) return;
  const it = {
    id: editId ? Number(editId) : Date.now(), title, category, status: $('inputStatus').value, poster: posterValue, year,
    rating: $('inputRating').value, extRating: $('inputExtRating').value, description: $('inputDescription').value.trim(),
    titleEn: $('inputTitleEn').value.trim(), titleOrig: $('inputTitleOrig').value.trim(), alt: $('inputAlt').value.trim(),
    tags: parseTags($('inputTags').value)
  };
  const k = items.findIndex(x => x.id === it.id);
  if (k > -1) items[k] = it; else items.push(it);
  refresh(); closeAll(); if (editId) openDetail(it.id);
  cloudSave(it);
};

function openDetail(id) {
  const i = items.find(x => x.id === id); if (!i) return; curId = id;
  $('detailPoster').src = i.poster || FALL; $('detailTitle').textContent = i.title; $('detailStatus').textContent = i.status;
  $('detailMeta').textContent = `${i.category} • ${i.year || 'Год не указан'}`;
  $('detailNames').textContent = [i.titleEn, i.titleOrig, i.alt].filter(Boolean).join(' / ');
  $('detailRating').textContent = `★ Моя оценка: ${i.rating ? i.rating + '/10' : '-/10'}${i.extRating ? ' | Внешняя оценка: ' + i.extRating : ''}`;
  const tg = $('detailTags'); tg.replaceChildren();
  (i.tags || []).forEach(t => { const c = el('button', 'chip', t); c.onclick = () => { closeAll(); $('tagFilter').value = t.toLowerCase(); render(); }; tg.append(c); });
  $('detailDescription').textContent = i.description || 'Описание отсутствует.';
  $('detailModal').style.display = 'flex';
}
$('editItemBtn').onclick = () => { const i = items.find(x => x.id === curId); if (i) { closeAll(); openAdd(i); } };
$('deleteItemBtn').onclick = () => {
  if (!confirm('Точно удалить этот тайтл из коллекции?')) return;
  const id = curId; items = items.filter(i => i.id !== id); closeAll(); refresh();
  deleteDoc(doc(db, 'items', String(id))).catch(e => alert('Не удалось удалить в облаке: ' + e.message));
};

// ---------- Автозаполнение ----------
const decode = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
const RU = {Action:'Экшен',Adventure:'Приключения',Comedy:'Комедия',Drama:'Драма',Ecchi:'Эччи',Fantasy:'Фэнтези',Horror:'Ужасы','Mahou Shoujo':'Махо-сёдзё',Mecha:'Меха',Music:'Музыка',Mystery:'Детектив',Psychological:'Психология',Romance:'Романтика','Sci-Fi':'Научная фантастика','Slice of Life':'Повседневность',Sports:'Спорт',Supernatural:'Сверхъестественное',Thriller:'Триллер'};
const TG = {28:'Боевик',12:'Приключения',16:'Мультфильм',35:'Комедия',80:'Криминал',99:'Документальный',18:'Драма',10751:'Семейный',14:'Фэнтези',36:'История',27:'Ужасы',10402:'Музыка',9648:'Детектив',10749:'Мелодрама',878:'Фантастика',53:'Триллер',10752:'Военный',37:'Вестерн',10759:'Боевик и приключения',10765:'Фантастика и фэнтези',10768:'Война и политика'};

async function anilist(search, type) {
  const gql = 'query($s:String,$t:MediaType){Page(perPage:10){media(search:$s,type:$t,sort:SEARCH_MATCH){format countryOfOrigin title{romaji english native} synonyms coverImage{large} description(asHtml:false) startDate{year} averageScore genres}}}';
  const r = await fetch('https://graphql.anilist.co', {method: 'POST', headers: {'Content-Type': 'application/json', Accept: 'application/json'}, body: JSON.stringify({query: gql, variables: {s: search, t: type}})});
  const j = await r.json(); if (j.errors) throw new Error(j.errors[0].message);
  return j.data.Page.media.map(m => {
    const t = m.title, main = t.english || t.romaji || t.native;
    const alt = [...new Set([t.romaji, ...(m.synonyms || [])].filter(x => x && x !== main && x !== t.english))].join(', ');
    return {
      title: main, en: t.english || '', orig: t.native || '', alt, poster: m.coverImage.large, year: m.startDate.year || '',
      ext: m.averageScore ? (m.averageScore / 10).toFixed(1) : '', tags: (m.genres || []).map(g => RU[g] || g),
      desc: m.description ? decode(m.description.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '')).trim() : '',
      category: type === 'ANIME' ? 'Аниме' : m.format === 'NOVEL' ? 'Ранобэ' : ['KR', 'CN'].includes(m.countryOfOrigin) ? 'Манхва' : 'Манга'
    };
  });
}

async function tmdb(search) {
  let k = TMDB_KEY || localStorage.getItem('tmdbKey');
  if (!k) {
    k = (prompt('Для поиска фильмов нужен бесплатный ключ TMDB (API Key v3). Вставь его — он сохранится на этом устройстве:') || '').trim();
    if (!k) throw new Error('нужен ключ TMDB');
    localStorage.setItem('tmdbKey', k);
  }
  const r = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${encodeURIComponent(k)}&language=ru-RU&include_adult=false&query=${encodeURIComponent(search)}`);
  if (r.status === 401) { localStorage.removeItem('tmdbKey'); throw new Error('ключ TMDB не подошёл, попробуй ещё раз'); }
  const j = await r.json();
  return (j.results || []).filter(x => x.media_type === 'movie' || x.media_type === 'tv').slice(0, 10).map(x => {
    const orig = x.original_title || x.original_name || '', ids = x.genre_ids || [];
    return {
      title: x.title || x.name, en: x.original_language === 'en' ? orig : '', orig, alt: '',
      poster: x.poster_path ? 'https://image.tmdb.org/t/p/w342' + x.poster_path : '',
      year: (x.release_date || x.first_air_date || '').slice(0, 4), ext: x.vote_count ? x.vote_average.toFixed(1) : '',
      tags: ids.map(g => TG[g]).filter(Boolean), desc: x.overview || '',
      category: ids.includes(16) ? 'Мультфильм' : x.media_type === 'tv' ? 'Сериал' : 'Фильм'
    };
  });
}

function fillForm(r) {
  if (!$('inputTitle').value.trim()) $('inputTitle').value = r.title;
  $('inputTitleEn').value = r.en; $('inputTitleOrig').value = r.orig; $('inputAlt').value = r.alt;
  $('inputCategory').value = r.category; $('inputYear').value = r.year; $('inputExtRating').value = r.ext;
  $('inputDescription').value = r.desc; $('inputTags').value = parseTags($('inputTags').value + ',' + r.tags.join(',')).join(', ');
  setPoster(r.poster); afHint();
}

$('afBtn').onclick = async () => {
  const q = $('afQuery').value.trim(), c = $('inputCategory').value, box = $('afResults'); if (!q) return;
  box.replaceChildren(el('div', 'meta', 'Ищу...'));
  try {
    const res = c === 'Аниме' ? await anilist(q, 'ANIME') : ['Манга', 'Манхва', 'Ранобэ'].includes(c) ? await anilist(q, 'MANGA') : await tmdb(q);
    box.replaceChildren(); if (!res.length) return box.append(el('div', 'meta', 'Ничего не найдено.'));
    res.forEach(r => {
      const row = el('div', 'afr'), im = el('img'), t = el('div');
      im.loading = 'lazy'; im.src = r.poster || FALL;
      t.append(el('b', null, r.title), el('div', 'meta', `${r.category} • ${r.year || '?'}${r.ext ? ' • ★ ' + r.ext : ''}`));
      row.append(im, t); row.onclick = () => { fillForm(r); box.replaceChildren(); }; box.append(row);
    });
  } catch (e) { box.replaceChildren(el('div', 'meta', 'Ошибка поиска: ' + e.message)); }
};
$('afQuery').onkeydown = e => { if (e.key === 'Enter') $('afBtn').click(); };

// ---------- Статистика (по внешним оценкам) ----------
$('statsBtn').onclick = () => {
  const b = $('statsBody'); b.replaceChildren();
  const avg = a => { a = a.filter(i => num(i.extRating)); return a.length ? (a.reduce((s, i) => s + num(i.extRating), 0) / a.length).toFixed(2) : '—'; };
  const block = (title, rows) => {
    b.append(el('h4', null, title)); const max = Math.max(1, ...rows.map(r => r[1]));
    rows.forEach(([n, c, x]) => { const r = el('div', 'sr'), bar = el('div', 'bar'); bar.style.width = (c / max * 100) + '%'; r.append(el('span', null, n), bar, el('span', 'meta', x)); b.append(r); });
  };
  b.append(el('div', null, `Всего тайтлов: ${items.length}`), el('div', 'meta', `Средняя внешняя оценка: ${avg(items)}`));
  block('По категориям (кол-во, средняя внешняя оценка)', CATS.map(c => { const a = items.filter(i => i.category === c); return [c, a.length, avg(a)]; }).filter(r => r[1]));
  block('По статусам', STATS.map(s => [s, items.filter(i => i.status === s).length, '']).filter(r => r[1]));
  const tc = {}; items.forEach(i => (i.tags || []).forEach(t => tc[t] = (tc[t] || 0) + 1));
  block('Частые жанры и теги', Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([t, c]) => [t, c, '']));
  block('Топ по внешней оценке', items.filter(i => num(i.extRating)).sort((a, b) => num(b.extRating) - num(a.extRating)).slice(0, 5).map(i => [i.title, num(i.extRating), i.extRating]));
  $('statsModal').style.display = 'flex';
};

// ---------- Бэкап ----------
window.exportData = () => {
  if (!items.length) return alert('Коллекция пуста, нечего скачивать.');
  const a = document.createElement('a'), u = URL.createObjectURL(new Blob([JSON.stringify(items, null, 2)], {type: 'application/json'}));
  a.href = u; a.download = `MediaTracker_Backup_${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(u);
};

// Старые бэкапы (без id, категория «Кино») тоже подходят: id выдаётся заново, повторы пропускаются
const key = i => (i.title + '|' + i.category).toLowerCase();
window.importData = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const arr = JSON.parse(r.result); if (!Array.isArray(arr)) throw 0;
      const ids = new Set(items.map(i => String(i.id))), keys = new Set(items.map(key)), add = [];
      arr.forEach((x, n) => {
        const it = {
          id: Number(x.id) || Date.now() + n, title: String(x.title || '').trim(),
          category: x.category === 'Кино' ? 'Фильм' : CATS.includes(x.category) ? x.category : 'Фильм',
          status: STATS.includes(x.status) ? x.status : 'В планах', poster: x.poster || '', year: x.year || '', rating: x.rating || '',
          extRating: x.extRating || '', description: x.description || '', titleEn: x.titleEn || '', titleOrig: x.titleOrig || '',
          alt: x.alt || '', tags: Array.isArray(x.tags) ? x.tags : []
        };
        if (!it.title || ids.has(String(it.id)) || keys.has(key(it))) return;
        ids.add(String(it.id)); keys.add(key(it)); add.push(it);
      });
      for (let i = 0; i < add.length; i += 400) {
        const b = writeBatch(db); add.slice(i, i + 400).forEach(it => b.set(doc(db, 'items', String(it.id)), {...it, userId: user.uid})); await b.commit();
      }
      alert(`Добавлено: ${add.length}. Пропущено повторов: ${arr.length - add.length}.`);
    } catch (err) { alert('Ошибка: файл не подходит или не удалось сохранить.'); }
    e.target.value = '';
  };
  r.readAsText(f);
};
</script>
