<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="darkreader-lock">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0b12">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой Медиа Трекер</title>
<style>
:root{--bg:#0d0f14;--card:#171a22;--inp:#1b1e27;--bd:#262a36;--ac:#7c5cff;--ach:#9478ff;--mu:#9aa0b4}
*{box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px}
#authScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;text-align:center;gap:20px}
#appScreen{display:none}
header{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:15px;background:rgba(13,15,20,.88);backdrop-filter:blur(10px);margin:-20px -20px 16px;padding:14px 20px;border-bottom:1px solid var(--bd)}
.logo{background:linear-gradient(90deg,#fff,#a893ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row2{display:flex;gap:10px}.row2>*{flex:1}
input,select,textarea{padding:10px;background:var(--inp);border:1px solid #333847;color:#fff;border-radius:10px;font-family:inherit;min-width:0;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
textarea{resize:vertical;min-height:80px}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 16px;cursor:pointer;border-radius:10px;font-weight:bold;transition:.15s}
.btn:hover{background:var(--ach)}.btn:active{transform:scale(.97)}
.btn-s{background:#262a36}.btn-s:hover{background:#333847}
.btn-d{background:#cf6679;color:#000}.btn-d:hover{background:#ff758c}
.btn-g{background:#4285F4;font-size:16px;padding:12px 20px}.btn-g:hover{background:#3367D6}
#searchInput{flex:1;max-width:300px;min-width:140px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 5px;align-items:center}
.fb,.kb,.tb{background:#1b1e27;color:#cfd3e2;border:1px solid #2c3040;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s}
.fb:hover,.kb:hover,.tb:hover{border-color:var(--ac)}
.fb.on,.kb.on,.tb.on{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 0 14px rgba(124,92,255,.45)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,190px),1fr));gap:28px 20px;margin-top:22px}
.msg{color:#777;grid-column:1/-1}
.card{cursor:pointer;animation:fin .3s ease both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
.pc{position:relative;width:100%;padding-top:150%;border-radius:14px;overflow:hidden;background:#222633;transition:transform .15s ease-out,box-shadow .3s}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .pc{box-shadow:0 14px 34px rgba(124,92,255,.38)}
.card:hover .pc img{transform:scale(1.1)}
.ov{position:absolute;inset:0;z-index:1;display:flex;align-items:flex-end;padding:12px;opacity:0;transition:opacity .25s;background:linear-gradient(to top,rgba(8,9,14,.97) 0%,rgba(8,9,14,.78) 55%,rgba(8,9,14,.1) 100%)}
.card:hover .ov{opacity:1}
.ov p{margin:0;font-size:12px;line-height:1.45;color:#ddd;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.status{display:inline-block;background:#1db57a;color:#fff;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.status[data-s="В планах"]{background:#5b6b8c}
.status[data-s="Смотрю/Читаю"]{background:#2f8fe8}
.status[data-s="Любимое"]{background:#e0457b}
.status[data-s="Пересматриваю"]{background:#8a5cf0}
.status[data-s="Брошено"]{background:#c2543e}
.pc .status{position:absolute;top:10px;left:10px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mine{position:absolute;right:10px;bottom:10px;z-index:2;background:rgba(124,92,255,.92);padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;transition:opacity .25s}
.card:hover .mine{opacity:0}
.title{font-size:15px;font-weight:700;margin:10px 0 6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--mu)}
.star{display:inline-block;color:#fff;font-weight:700}
.star::first-letter{color:#ffc107}
.tg{font-size:12px;color:#8a90a8;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--mu);margin-bottom:8px}
.ratings{font-size:14px;color:#ffb74d;line-height:1.5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);justify-content:center;align-items:center;z-index:1000;padding:10px}
.mc{background:var(--card);padding:22px;border-radius:16px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;border:1px solid var(--bd);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.mb{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
#detailModal .mc{max-width:780px;display:grid;grid-template-columns:230px 1fr;gap:12px 22px;align-content:start}
#detailModal .mc>*{grid-column:2;min-width:0}
#detailModal #detailPoster{grid-column:1;grid-row:1/9;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;align-self:start;background:#222633}
#detailDescription{font-size:14px;line-height:1.55;color:#ccc;background:#12141b;padding:12px;border-radius:10px;white-space:pre-wrap}
@media(max-width:640px){#detailModal .mc{grid-template-columns:1fr}#detailModal .mc>*,#detailModal #detailPoster{grid-column:1;grid-row:auto}#detailModal #detailPoster{max-width:220px;margin:auto}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#222633;border:1px solid #333847;color:#ddd;border-radius:12px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--ac)}
.af{background:#12141b;border:1px dashed #333847;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
#afResults{max-height:230px;overflow-y:auto}
.afr{display:flex;gap:10px;align-items:center;padding:6px;border-radius:8px;cursor:pointer}
.afr:hover{background:#222633}
.afr img{width:40px;height:56px;object-fit:cover;border-radius:4px;background:#222633}
#posterPreview{height:70px;border-radius:6px;background:#222633}
.bar{height:8px;background:var(--ac);border-radius:4px}
.sr{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
#importFile{display:none}
@media(max-width:600px){.hdr-actions{width:100%;justify-content:space-between}.grid{grid-template-columns:repeat(2,1fr);gap:20px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ong{display:inline-block;background:#ff9800;color:#000;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.3px}
.ong::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#000;margin-right:5px;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.2}}
.pc .ong{position:absolute;top:10px;right:10px;z-index:2}
.bd2{display:none}
.credits{display:flex;flex-direction:column;gap:6px}
.cr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cr .meta{margin:0;min-width:64px}
.grid.list{grid-template-columns:1fr;gap:10px}
.list .card{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;transition:border-color .15s}
.list .card:hover{border-color:var(--ac)}
.list .pc{border-radius:8px}
.list .pc .status,.list .pc .ong,.list .ov{display:none}
.list .card:hover .pc{box-shadow:none}
.list .card:hover .pc img{transform:none}
.list .mine,.list .card:hover .mine{right:4px;bottom:4px;font-size:10px;padding:2px 6px;opacity:1}
.list .title{margin:0 0 4px;-webkit-line-clamp:1}
.list .bd2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--bd)}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:10px 16px;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit}
.tab.on{color:#fff;border-color:var(--ac)}
.qa{position:absolute;right:10px;bottom:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .15s}
.qa:hover{transform:scale(1.12)}.qa.done{background:#1db57a}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 16px;min-width:104px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;color:#fff;cursor:pointer;font-family:inherit}
.tile b{font-size:22px}.tile span{font-size:12px;color:var(--mu)}.tile:hover{border-color:var(--ac)}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:2000;align-items:center;width:max-content;max-width:92vw}
.toast{background:#262a36;border:1px solid #333847;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:14px;display:flex;gap:14px;align-items:center;white-space:pre-line;animation:pop .2s ease}
.toast.bad{border-color:#cf6679;background:#3a1f27}
.toast button{background:none;border:0;color:#b39dff;font-weight:700;cursor:pointer;font-size:14px}
.sync{font-size:12px;color:#7d839a;white-space:nowrap}.sync.sav{color:#ffb74d}.sync.err{color:#ff6b81}
.sk{aspect-ratio:2/3;border-radius:14px;background:linear-gradient(90deg,#1b1e27 25%,#242836 50%,#1b1e27 75%);background-size:200% 100%;animation:shim 1.2s infinite}
@keyframes shim{to{background-position:-200% 0}}
.card:focus-visible{outline:2px solid var(--ac);outline-offset:4px;border-radius:14px}
.sec{margin:14px 0 8px;font-size:15px}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.mini{flex:none;width:96px;cursor:pointer}
.mini img{width:96px;height:144px;object-fit:cover;border-radius:10px;display:block;background:#222633;transition:transform .2s}
.mini:hover img{transform:translateY(-4px)}
.mini span{display:block;font-size:11px;margin-top:5px;color:#cfd3e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.brand{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7c5cff,#a893ff);display:grid;place-items:center;font-size:15px;color:#fff}
.acc{position:relative}.av{padding:0;border:2px solid var(--bd);background:#222633;border-radius:50%;width:40px;height:40px;cursor:pointer;overflow:hidden}.av:hover{border-color:var(--ac)}.av img{width:100%;height:100%;object-fit:cover;display:block}
.menu{display:none;position:absolute;right:0;top:48px;min-width:210px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:60}.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#e6e8f0;padding:10px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}.menu button:hover{background:#262a36}.menu .out{color:#ff6b81}
.pcard{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,#1f1a3d,#171a22 65%);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.pcard img{width:72px;height:72px;border-radius:50%;background:#222633;object-fit:cover;border:2px solid var(--ac)}
.pinfo{flex:1;min-width:160px}.pinfo b{font-size:20px}.pinfo .meta{margin:2px 0 0}
.ring{--p:0;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),#262a36 0);display:grid;place-items:center;position:relative}
.ring::before{content:'';position:absolute;inset:7px;border-radius:50%;background:#171a22}.ring span{position:relative;font-weight:800;font-size:15px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:14px}
.pb{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px}.pb h4{margin:4px 0 10px;font-size:14px}
.pb .sr.go{cursor:pointer}.pb .sr.go:hover span:first-child{color:#fff}.pb .sr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:flex;align-items:flex-end;gap:5px;height:130px}.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--mu)}
.hist i{display:block;width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}.donut::after{content:'';position:absolute;inset:24px;border-radius:50%;background:var(--card)}
.lg{display:flex;flex-direction:column;gap:6px;font-size:13px}.lg .go{cursor:pointer;display:flex;gap:7px;align-items:center}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hl{display:flex;flex-direction:column;gap:7px;font-size:13px}.hl span{color:var(--mu)}
.pset{margin-bottom:14px;font-size:13px}.pset summary{cursor:pointer;color:var(--mu)}.pset label{display:inline-block;margin:8px 14px 0 0;cursor:pointer}
.card:focus-visible{outline:2px solid var(--ac)}
/* ===== Тема «стекло» ===== */
:root{color-scheme:dark;--bg:#090a11;--card:rgba(30,32,48,.55);--inp:rgba(255,255,255,.06);--bd:rgba(255,255,255,.11);--ac:#8b6cff;--ach:#a48dff;--mu:#a9afc6}
html{scrollbar-color:rgba(255,255,255,.22) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:10px}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 10% -8%,rgba(139,108,255,.30),transparent 62%),radial-gradient(800px 520px at 100% 6%,rgba(56,189,248,.15),transparent 60%),radial-gradient(800px 560px at 55% 112%,rgba(236,72,153,.14),transparent 60%)}
header{background:rgba(14,15,26,.55);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 8px 30px rgba(0,0,0,.28)}
.pb,.pcard,.tile,.menu,.toast,.mc{backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35)}
.btn{background:linear-gradient(135deg,var(--ach),var(--ac));border-radius:12px;padding:10px 18px;box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:hover{background:linear-gradient(135deg,var(--ach),var(--ac));filter:brightness(1.12);transform:translateY(-1px)}
.btn-s{background:rgba(255,255,255,.07);border:1px solid var(--bd);box-shadow:none}.btn-s:hover{background:rgba(255,255,255,.14);filter:none}
.btn-d{background:rgba(207,102,121,.9)}.btn-g{background:#4285F4}
.btn:disabled,.tb:disabled,.qa:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn:focus-visible,.fb:focus-visible,.tb:focus-visible,.tab:focus-visible,.tile:focus-visible,.menu button:focus-visible,.av:focus-visible{outline:2px solid #cbbfff;outline-offset:2px}
input,select,textarea{background:var(--inp);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
select option{background:#1a1c2a;color:#fff}
#cgSearch{max-width:460px!important}
#cgSearch,#searchInput{padding-left:38px;background:var(--inp) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%23a9afc6' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") no-repeat 12px center}
.fb,.kb,.tb{background:rgba(255,255,255,.06);border:1px solid var(--bd);padding:8px 16px;font-family:inherit;font-size:14px}
.fb:hover,.kb:hover,.tb:hover{background:rgba(255,255,255,.12)}
.fb.on,.kb.on,.tb.on{background:linear-gradient(135deg,var(--ach),var(--ac));border-color:transparent;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.tabs{display:inline-flex;gap:4px;padding:4px;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:14px;margin-bottom:18px}
.tab{border:0;border-radius:10px;padding:9px 20px;transition:.2s}
.tab.on{background:linear-gradient(135deg,var(--ach),var(--ac));box-shadow:0 4px 14px rgba(0,0,0,.3)}
.grid{gap:34px 22px}
.pc{border-radius:16px;border:1px solid rgba(255,255,255,.07);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.card:hover .pc{transform:translateY(-3px);box-shadow:0 18px 38px rgba(0,0,0,.5)}
.card:hover .pc img{transform:scale(1.04)}
.title{font-size:15px;margin:12px 0 6px}.tg{color:#9aa1ba}.msg{text-align:center;padding:48px 10px;font-size:15px;color:var(--mu)}
.qa{width:34px;height:34px;background:rgba(18,20,32,.62);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2)}
.qa:hover{background:var(--ac);transform:scale(1.1)}.qa.done{background:rgba(29,181,122,.9);border-color:transparent}
.modal{background:rgba(5,6,12,.62);backdrop-filter:blur(10px)}
.mc{background:rgba(26,28,44,.74);border-color:rgba(255,255,255,.13);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
#addModal .mc{max-width:640px}
#detailDescription,.af{background:rgba(0,0,0,.25)}.chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.toast{background:rgba(30,32,50,.78);border-color:rgba(255,255,255,.15)}.toast.bad{background:rgba(92,28,46,.8)}
.tile{border-radius:14px;transition:.2s}.tile:hover{transform:translateY(-2px)}.tile b{font-size:24px}
.pb,.pcard{border-radius:18px}.pcard{background:linear-gradient(135deg,rgba(139,108,255,.28),rgba(30,32,48,.55) 60%)}
.donut::after{background:#1a1c2b}
.brand{background:linear-gradient(135deg,var(--ach),var(--ac));box-shadow:0 6px 16px rgba(0,0,0,.3)}
.menu .sw{display:flex;gap:8px;padding:8px 12px}.menu .sw button{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.fb[data-c="Аниме"]::before,#cgCats .tb[data-g="Аниме"]::before{content:"🌸 "}
.fb[data-c="Манга"]::before,#cgCats .tb[data-g="Манга"]::before{content:"📖 "}
.fb[data-c="Ранобэ"]::before,#cgCats .tb[data-g="Ранобэ"]::before{content:"📚 "}
.fb[data-c="Фильм"]::before,#cgCats .tb[data-g="Фильм"]::before{content:"🎬 "}
.fb[data-c="Сериал"]::before,#cgCats .tb[data-g="Сериал"]::before{content:"📺 "}
.fb[data-c="Мультфильм"]::before{content:"🧸 "}
@media(hover:none){.card .ov{display:none}}
@media(max-width:600px){body{padding:12px}header{margin:-12px -12px 12px;padding:10px 12px}.btn,.fb,.tb,.tab,select,input{min-height:40px}.tabs{display:flex;width:100%}.tab{flex:1;padding:9px 6px}.row2{flex-direction:column}#addModal .mc{max-width:100%}}

/* ===== Форма и скрытие ===== */
.fs{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ach);font-weight:700;margin:8px 0 -4px;padding-top:8px;border-top:1px solid var(--bd)}
.mc>.fs:first-of-type{border-top:0;padding-top:0}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fld>label{font-size:12px;color:var(--mu);font-weight:600}
#addModal .mb{flex-wrap:wrap}
.hid{position:absolute;left:10px;bottom:10px;z-index:3;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(18,20,32,.62);backdrop-filter:blur(8px);color:#fff;font-size:12px;cursor:pointer;opacity:0;transition:.2s}
.card:hover .hid,.hid:focus-visible{opacity:1}.hid:hover{background:#cf6679}
@media(hover:none){.hid{opacity:.75}}
</style>
</head>
<body>

<div id="authScreen">
  <h1>Мой Медиа Трекер</h1>
  <p style="color:var(--mu)">Войдите под своим аккаунтом Google, чтобы синхронизировать коллекцию</p>
  <button class="btn btn-g" id="loginBtn">Войти через Google</button>
</div>

<div id="appScreen">
  <header>

<div id="toasts"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,signInWithPopup,signInWithRedirect,GoogleAuthProvider,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,query,where,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// Ключ TMDB (для поиска фильмов и сериалов). Можно оставить пустым — сайт сам спросит при первом поиске.
const TMDB_KEY = "";

const app = initializeApp({
  apiKey: "AIzaSyCBBC6gBLvCV7Jx1C8NaMheXwqqKPvpnt8",
  authDomain: "mymediatracker-6e179.firebaseapp.com",
  projectId: "mymediatracker-6e179",
  storageBucket: "mymediatracker-6e179.firebasestorage.app",
  messagingSenderId: "642718397694",
  appId: "1:642718397694:web:7a4e175ed593cc364961af",
  measurementId: "G-NKNYFSP981"
});
const auth = getAuth(app), db = getFirestore(app), provider = new GoogleAuthProvider();

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const CATS = ['Фильм','Сериал','Аниме','Манга','Ранобэ','Мультфильм'];
const fix = i => { if (i.category === 'Манхва') { i.category = 'Манга'; i.kind = 'Манхва'; } else if (i.category === 'Манга' && !i.kind) i.kind = 'Манга'; return i; };
const catLabel = i => i.category === 'Манга' && i.kind && i.kind !== 'Манга' ? i.kind : i.category;
const STATS = ['В планах','Смотрю/Читаю','Просмотрено/Прочитано','Любимое','Пересматриваю','Брошено'];
const FALL = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280"><rect width="200" height="280" fill="%232c2c2c"/><text x="50%" y="50%" fill="%23777" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle">Нет постера</text></svg>';

let user = null, items = [], loaded = false, cat = 'Всё', kind = 'Все', curId = null, unsub = null, posterValue = '', view = localStorage.getItem('view') || 'grid', ongOnly = false, xf = null, lastList = [], afTok = 0;
const grid = $('itemsGrid');

// ---------- Вход ----------
$('loginBtn').onclick = () => signInWithPopup(auth, provider).catch(e => {
  if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) return signInWithRedirect(auth, provider);
  if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code))
    toast('Ошибка входа: ' + e.message + '\nЕсли открыл ссылку из Telegram или другого приложения — открой сайт в обычном браузере.');
});
$('logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  user = u;
  if (u) {
    $('authScreen').style.display = 'none'; $('appScreen').style.display = 'block'; $('hdrAvatar').src = u.photoURL || ''; $('profName').textContent = u.displayName || u.email; $('profMail').textContent = u.email; $('avatar').src = u.photoURL || '';
    loaded = false; render(); if (!cgGrid.children.length) cgLoad(true);
    // Живая синхронизация: изменения с другого устройства появляются сами
    unsub = onSnapshot(query(collection(db, 'items'), where('userId', '==', u.uid)),
      snap => { items = snap.docs.map(d => fix(d.data())); loaded = true; refresh(); },
      err => toast('Не удалось загрузить данные: ' + err.message));
  } else {
    if (unsub) unsub(); unsub = null; items = []; loaded = false;
    $('appScreen').style.display = 'none'; $('authScreen').style.display = 'flex';
  }
});

let pend = 0, syncBad = false;
const setSync = () => {
  const e = $('syncState');
  if (!navigator.onLine) { e.className = 'sync err'; e.textContent = '⚠ Нет подключения'; }
  else if (pend) { e.className = 'sync sav'; e.textContent = '⏳ Сохранение...'; }
  else if (syncBad) { e.className = 'sync err'; e.textContent = '⚠ Ошибка сохранения'; }
  else { e.className = 'sync'; e.textContent = '☁ Синхронизировано'; }
};
const track = p => { pend++; setSync(); return p.then(() => { pend--; if (!pend) syncBad = false; setSync(); }, e => { pend--; syncBad = true; setSync(); throw e; }); };
addEventListener('online', setSync); addEventListener('offline', setSync);
const cloudSave = it => track(setDoc(doc(db, 'items', String(it.id)), {...it, userId: user.uid})).catch(e => toast('Не удалось сохранить в облако: ' + e.message, true));

// ---------- Отрисовка ----------
const names = i => [i.title, i.titleEn, i.titleOrig, i.alt, i.author, i.studio, i.source, i.year, (i.tags || []).join(' ')].join(' ').toLowerCase();
const xmatch = i => xf.k === 'source' ? i.source === xf.v : (i[xf.k] || '').split(',').some(x => x.trim().toLowerCase() === xf.v.toLowerCase());
const num = v => parseFloat(v) || 0;
let lastId = 0;
const newId = () => { const n = Date.now() * 1000 + Math.floor(Math.random() * 1000); return lastId = n > lastId ? n : lastId + 1; };
// Фильм и сериал — разные произведения; «Мультфильм» может быть и тем и другим
const KINO = ['Фильм', 'Сериал', 'Мультфильм'];
const sameCat = (a, b) => a === b || ((a === 'Мультфильм' || b === 'Мультфильм') && KINO.includes(a) && KINO.includes(b));
const nset = o => [o.title, o.titleEn || o.en, o.titleOrig || o.orig, ...String(o.alt || '').split(',')].map(x => (x || '').trim().toLowerCase()).filter(Boolean);
const same = (a, b) => sameCat(a.category, b.category) && nset(a).some(n => nset(b).includes(n));
function toast(msg, bad, act) {
  const t = el('div', 'toast' + ((bad ?? /не удалось|ошибк|обязательно|должен|нужен/i.test(msg)) ? ' bad' : ''), msg);
  if (act) { const b = el('button', null, act.label); b.onclick = () => { act.fn(); t.remove(); }; t.append(b); }
  $('toasts').append(t); setTimeout(() => t.remove(), act ? 7000 : 4500);
}

function refresh() { refreshTags(); render(); profStats(); cgMarks(); catCounts(); }
function catCounts() {
  document.querySelectorAll('#catFilters .fb').forEach(b => { if (!b.dataset.l) b.dataset.l = b.textContent; const n = b.dataset.c === 'Всё' ? items.length : items.filter(i => i.category === b.dataset.c).length; b.textContent = b.dataset.l + (n ? ' ' + n : ''); });
}

function refreshTags() {
  const sel = $('tagFilter'), old = sel.value, map = new Map();
  items.forEach(i => (i.tags || []).forEach(t => { if (!map.has(t.toLowerCase())) map.set(t.toLowerCase(), t); }));
  sel.replaceChildren(new Option('Все жанры и теги', 'Все'));
  [...map].sort((a, b) => a[1].localeCompare(b[1])).forEach(([k, v]) => sel.add(new Option(v, k)));
  sel.value = map.has(old) ? old : 'Все';
}

function render() {
  grid.replaceChildren();
  lastList = []; grid.className = 'grid' + (view === 'list' ? ' list' : ''); $('viewBtn').textContent = view === 'list' ? '▦ Сетка' : '☰ Список';
  if (!loaded) return grid.append(el('div', 'msg', 'Загрузка...'));
  if (!items.length) return grid.append(el('div', 'msg', 'Коллекция пуста. Нажми «+ Добавить».'));
  const q = $('searchInput').value.toLowerCase().trim(), st = $('statusFilter').value, tg = $('tagFilter').value, so = $('sortSelect').value;
  const list = items.filter(i =>
    (!q || names(i).includes(q)) && (cat === 'Всё' || i.category === cat) && (cat !== 'Манга' || kind === 'Все' || i.kind === kind) && (!ongOnly || i.ongoing) && (!xf || xmatch(i)) && (st === 'Все' || i.status === st) &&
    (tg === 'Все' || (i.tags || []).some(t => t.toLowerCase() === tg))
  ).sort((a, b) => {
    if (so === 'dateAsc') return a.id - b.id;
    if (so === 'titleAsc') return a.title.localeCompare(b.title);
    if (so === 'ratingDesc') return num(b.rating) - num(a.rating);
    if (so === 'extDesc') return num(b.extRating) - num(a.extRating);
    if (so === 'yearDesc') return num(b.year) - num(a.year);
    if (so === 'yearAsc') return (num(a.year) || 9999) - (num(b.year) || 9999);
    return b.id - a.id;
  });
  lastList = list; $('countInfo').textContent = `Показано: ${list.length} из ${items.length}`;
  const xb = $('xfBtn'); xb.style.display = xf ? '' : 'none'; if (xf) xb.textContent = `${{author: 'Автор', studio: 'Студия', source: 'Источник'}[xf.k]}: ${xf.v} ✕`;
  if (!list.length) return grid.append(el('div', 'msg', 'Ничего не найдено.'));
  const SHORT = {'Просмотрено/Прочитано': 'Завершено', 'Смотрю/Читаю': 'В процессе'};
  list.forEach(i => {
    const card = el('div', 'card'), pc = el('div', 'pc'), img = el('img'), st = el('div', 'status', SHORT[i.status] || i.status);
    st.dataset.s = i.status;
    img.loading = 'lazy'; img.src = i.poster || FALL; img.onerror = () => { img.onerror = null; img.src = FALL; };
    const ov = el('div', 'ov'); ov.append(el('p', null, i.description || 'Описание отсутствует.'));
    pc.append(img, ov, st);
    if (i.ongoing) pc.append(el('div', 'ong', 'ОНГОИНГ'));
    if (i.rating) pc.append(el('div', 'mine', '★ ' + i.rating));
    const info = el('div', 'ci'), row = el('div', 'cm');
    row.append(el('span', null, [i.year, catLabel(i)].filter(Boolean).join('  |  ')), el('span', 'star', i.extRating ? '★ ' + i.extRating : ''));

async function anilist(search, type, o = {}) {
  const gql = 'query($s:String,$t:MediaType,$p:Int,$pp:Int,$so:[MediaSort],$st:MediaStatus,$f:MediaFormat,$fn:MediaFormat,$c:CountryCode,$ad:Boolean,$pg:Int,$g:[String],$sg:FuzzyDateInt,$sl:FuzzyDateInt){Page(page:$p,perPage:$pp){media(search:$s,type:$t,sort:$so,status:$st,format:$f,format_not:$fn,countryOfOrigin:$c,isAdult:$ad,popularity_greater:$pg,genre_in:$g,startDate_greater:$sg,startDate_lesser:$sl){format siteUrl countryOfOrigin title{romaji english native} synonyms coverImage{large} description(asHtml:false) startDate{year} averageScore genres status source studios(isMain:true){nodes{name}} staff(perPage:12){edges{role node{name{full}}}}}}}';
  const r = await fetch('https://graphql.anilist.co', {method: 'POST', headers: {'Content-Type': 'application/json', Accept: 'application/json'}, body: JSON.stringify({query: gql, variables: {s: search, t: type, p: o.page || 1, pp: o.per || 10, so: o.sort || ['SEARCH_MATCH'], st: o.status, f: o.format, fn: o.fn, c: o.country, ad: o.ad, pg: o.pg, g: o.genre, sg: o.sg, sl: o.sl}})});
  const j = await r.json(); if (j.errors) throw new Error(j.errors[0].message);

    const t = m.title, main = t.english || t.romaji || t.native;
    const stf = m.staff?.edges || [], pick = re => [...new Set(stf.filter(e => re.test(e.role)).map(e => e.node.name.full))].slice(0, 2).join(', ');
    const alt = [...new Set([t.romaji, ...(m.synonyms || [])].filter(x => x && x !== main && x !== t.english))].join(', ');

      author: type === 'ANIME' ? (pick(/Original Creator/i) || pick(/Director/i)) : (pick(/Story/i) || pick(/Art/i)),
      studio: (m.studios?.nodes || []).map(n => n.name).slice(0, 2).join(', '), source: SRC[m.source] || '', ongoing: m.status === 'RELEASING', src: 'AniList', url: m.siteUrl, poster: m.coverImage.large, year: m.startDate.year || '',
      ext: m.averageScore ? (m.averageScore / 10).toFixed(1) : '', tags: (m.genres || []).map(g => RU[g] || g),
      desc: m.description ? decode(m.description.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '')).trim() : '',

      kind: {KR: 'Манхва', CN: 'Маньхуа', TW: 'Маньхуа', JP: 'Манга'}[m.countryOfOrigin] || 'Комикс'

async function tmdb(search, path, media, page = 1) {

  const r = await fetch(path ? `https://api.themoviedb.org/3${path}${path.includes('?') ? '&' : '?'}api_key=${encodeURIComponent(k)}&language=ru-RU&page=${page}` : `https://api.themoviedb.org/3/search/multi?api_key=${encodeURIComponent(k)}&language=ru-RU&include_adult=false&query=${encodeURIComponent(search)}`);
  if (r.status === 401) { localStorage.removeItem('tmdbKey'); throw new Error('ключ TMDB не подошёл, попробуй ещё раз'); }

$('cgReset').onclick = () => { cgHid.clear(); cgHidSave(); $('cgSearch').value = ''; cg.q = ''; $('cgGenre').value = ''; $('cgYear').value = ''; $('cgKind').value = ''; $('cgMode').value = 'pop'; cg.hide = cg.poster = false; cg.min = 0; $('cgMin').value = '0'; $('cgClear').style.display = 'none'; ['cgHide', 'cgPoster'].forEach(i => $(i).classList.remove('on')); cgLoad(true); };
$('cgMore').onclick = () => cgLoad(false);
$('cgPoster').onclick = e => { cg.poster = !cg.poster; e.currentTarget.classList.toggle('on', cg.poster); cgLoad(true); };
$('cgMin').onchange = () => { cg.min = +$('cgMin').value || 0; cgLoad(true); };
$('cgClear').onclick = () => { $('cgSearch').value = ''; $('cgClear').style.display = 'none'; cgGo(); };
function cgGenres() {
  const sel = $('cgGenre'), tm = cg.g === 'Фильм' || cg.g === 'Сериал'; sel.replaceChildren(new Option('Все жанры', ''));
  Object.entries(tm ? TG : RU).filter(([k]) => !tm || (cg.g === 'Фильм' ? !['10759', '10765', '10768'].includes(k) : k !== '10770')).forEach(([k, v]) => sel.add(new Option(v, k)));
}
cgGenres();

// Случайное из каталога: берём случайную страницу популярного и случайный тайтл с неё
let rndR = null;
function showPreview(r, rnd) {
  rndR = r; const a = $('rndAdd'), d = has(r);
  $('rndPoster').src = r.poster || FALL; $('rndTitle').textContent = r.title;
  $('rndNames').textContent = [r.en, r.orig].filter(Boolean).join(' / ');
  $('rndMeta').textContent = [r.year, r.category, r.ext ? '★ ' + r.ext + (r.src ? ' (' + r.src + ')' : '') : '', r.ongoing ? 'Онгоинг' : ''].filter(Boolean).join(' | ');
  $('rndCredits').textContent = [r.author && 'Автор: ' + r.author, r.studio && 'Студия: ' + r.studio, r.source && 'Источник: ' + r.source].filter(Boolean).join('  •  ');
  $('rndTags').textContent = r.tags.join(', ');
  $('rndDesc').textContent = r.desc || 'Описание отсутствует.';
  $('rndLink').href = r.url || '#'; $('rndLink').style.display = r.url ? '' : 'none';
  $('rndMore').style.display = rnd ? '' : 'none';
  a.disabled = d; a.textContent = d ? '✓ Уже в коллекции' : '＋ В планы';
  $('rndModal').style.display = 'flex';
}
async function cgRandom() {
  const b = $('cgRand'); b.disabled = true;
  try {
    const md = $('cgMode').value, q = cg.q;
    const rp = q ? 1 : 1 + Math.floor(Math.random() * (md === 'new' || md === 'soon' ? 3 : md === 'top' ? 10 : 20)); let res = await cgFetch(rp, 24, q, md); if (!res.length && rp > 1) res = await cgFetch(1, 24, q, md);
    const fresh = res.filter(r => !has(r) && cgPass(r)), pool = fresh.length ? fresh : res;
    if (!pool.length) throw new Error('ничего не пришло');
    showPreview(pool[Math.floor(Math.random() * pool.length)], true);
  } catch (e) { toast('Не удалось получить случайный тайтл: ' + e.message, true); }
  b.disabled = false;
}
$('rndEdit').onclick = () => { closeAll(); openAdd(null); fillForm(rndR); if (rndR.tmdb) tmdbExtra(rndR).catch(() => {}); };
$('cgRand').onclick = cgRandom; $('rndMore').onclick = cgRandom;
$('rndAdd').onclick = async e => { const a = e.currentTarget; a.disabled = true; a.textContent = '...'; await quickAdd(rndR); a.textContent = '✓ Добавлено'; };

// ---------- Бэкап ----------
window.exportData = () => {
  if (!items.length) return toast('Коллекция пуста, нечего скачивать.');
  const a = document.createElement('a'), u = URL.createObjectURL(new Blob([JSON.stringify(items.map(({userId, ...r}) => r), null, 2)], {type: 'application/json'}));
  a.href = u; a.download = `MediaTracker_Backup_${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(u);
};

// Старые бэкапы (без id, категория «Кино») тоже подходят: id выдаётся заново, повторы пропускаются
// Повтор = то же произведение по любому названию (рус/англ/ориг/другие) в той же категории; фильм и сериал не путаются
window.importData = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const arr = JSON.parse(r.result); if (!Array.isArray(arr)) throw 0;
      const ids = new Set(items.map(i => String(i.id))), add = [], idx = new Map();
      const put = o => nset(o).forEach(n => { if (!idx.has(n)) idx.set(n, []); idx.get(n).push(o.category); });
      const dup = o => nset(o).some(n => (idx.get(n) || []).some(c => sameCat(c, o.category)));
      items.forEach(put);
      arr.forEach((x, n) => {
        const it = {
          id: Number(x.id) || 0, title: String(x.title || '').trim(),
          category: x.category === 'Кино' ? 'Фильм' : x.category === 'Манхва' ? 'Манга' : CATS.includes(x.category) ? x.category : 'Фильм', kind: x.category === 'Манхва' ? 'Манхва' : (x.kind || ''),
          status: STATS.includes(x.status) ? x.status : 'В планах', poster: x.poster || '', year: x.year || '', rating: x.rating || '',
          extRating: x.extRating || '', extSrc: x.extSrc || '', description: x.description || '', titleEn: x.titleEn || '', titleOrig: x.titleOrig || '',
          alt: x.alt || '', author: x.author || '', studio: x.studio || '', source: x.source || '', ongoing: !!x.ongoing, tags: Array.isArray(x.tags) ? x.tags : []
        };
        if (!it.title || dup(it)) return;
        while (!it.id || ids.has(String(it.id))) it.id = newId();
        ids.add(String(it.id)); put(it); add.push(it);
      });
      if (!confirm(`В файле записей: ${arr.length}. Будет добавлено: ${add.length}, пропущено повторов: ${arr.length - add.length}. Продолжить?`)) { e.target.value = ''; return; }
      for (let i = 0; i < add.length; i += 400) {
        const b = writeBatch(db); add.slice(i, i + 400).forEach(it => b.set(doc(db, 'items', String(it.id)), {...it, userId: user.uid})); await track(b.commit());
      }
      toast(`Добавлено: ${add.length}. Пропущено повторов: ${arr.length - add.length}.`);
    } catch (err) { toast('Ошибка: файл не подходит или не удалось сохранить.'); }
    e.target.value = '';
  };
  r.readAsText(f);
};
</script>
