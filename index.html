<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Медиа Трекер</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-input: #222;
            --border-color: #333;
            --accent: #6200ea;
            --accent-hover: #7c4dff;
            --text-main: #ffffff;
            --text-muted: #aaa;
            --status-bg: #03dac6;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Экраны авторизации */
        #authScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
            gap: 20px;
        }

        #appScreen {
            display: none;
        }

        /* Шапка и контролы */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            gap: 15px;
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        input, select, textarea {
            padding: 9px;
            background: var(--bg-input);
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            font-family: inherit;
        }

        .search-bar { width: 100%; max-width: 300px; }
        
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 9px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: #333; }
        .btn-secondary:hover { background: #444; }
        .btn-danger { background: #cf6679; color: #000; }
        .btn-danger:hover { background: #ff758c; }
        .btn-google { background: #4285F4; display: flex; align-items: center; gap: 10px; font-size: 16px; padding: 12px 20px; }
        .btn-google:hover { background: #3367D6; }

        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); }

        /* Сетка карточек */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, border 0.2s;
            border: 1px solid transparent;
        }
        .card:hover { transform: scale(1.02); border-color: var(--accent); }
        
        .poster-container { position: relative; width: 100%; padding-top: 140%; background: #2c2c2c; }
        .poster { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .card-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .title { font-size: 16px; font-weight: bold; margin: 0 0 5px 0; line-height: 1.2; }
        .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
        .status {
            align-self: flex-start;
            background: var(--status-bg);
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .ratings { font-size: 13px; color: #ff9800; margin-top: auto; line-height: 1.5; }

        /* Всплывающие окна */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-color);
        }
        .modal-content textarea { resize: vertical; min-height: 80px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        
        #detailPoster { width: 100%; height: auto; max-height: 400px; object-fit: contain; background: #111; border-radius: 4px; }
        #detailDescription { font-size: 14px; line-height: 1.5; color: #ccc; background: #222; padding: 12px; border-radius: 4px; margin-top: 10px;}

        #importFile { display: none; }
        
        @media (max-width: 600px) {
            .search-bar { max-width: 100%; }
            .header-actions { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="authScreen">
        <h1>Мой Медиа Трекер</h1>
        <p style="color: var(--text-muted);">Войдите под своим аккаунтом Google, чтобы синхронизировать коллекцию</p>
        <button class="btn btn-google" id="loginBtn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.82 2.71v2.26h2.94c1.72-1.58 2.78-3.9 2.78-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.84.86-3.02.86-2.32 0-4.29-1.57-5-3.68H1v2.33C2.53 15.96 5.51 18 9 18z"/><path fill="#FBBC05" d="M4 10.74c-.19-.57-.3-1.18-.3-1.74s.11-1.17.3-1.74V4.93H1.04C.38 6.25 0 7.76 0 9.37s.38 3.12 1.04 4.44l2.96-2.31z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.51 0 2.53 2.04 1 4.93l2.96 2.33c.71-2.11 2.68-3.68 5.04-3.68z"/></svg>
            Войти через Google
        </button>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС ТРЕКЕРА -->
    <div id="appScreen">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <h1 style="margin: 0; font-size: 24px;">Моя Коллекция</h1>
                <span id="userEmail" style="font-size: 13px; color: var(--text-muted);"></span>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="exportData()">⬇ Бэкап</button>
                <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">⬆ Загрузить</button>
                <input type="file" id="importFile" accept=".json" onchange="importData(event)">
                <button class="btn" id="openModalBtn">+ Добавить</button>
                <button class="btn btn-danger" id="logoutBtn" style="padding: 9px 10px;" title="Выйти">Выход</button>
            </div>
        </header>

        <div class="controls-row">
            <input type="text" id="searchInput" class="search-bar" placeholder="Поиск по названию...">
            
            <select id="statusFilter">
                <option value="Все">Все статусы</option>
                <option value="В планах">В планах</option>
                <option value="Смотрю/Читаю">Смотрю/Читаю</option>
                <option value="Просмотрено/Прочитано">Просмотрено/Прочитано</option>
                <option value="Любимое">Любимое</option>
                <option value="Пересматриваю">Пересматриваю</option>
                <option value="Брошено">Брошено</option>
            </select>

            <select id="sortSelect">
                <option value="dateDesc">По дате добавления (новые)</option>
                <option value="dateAsc">По дате добавления (старые)</option>
                <option value="titleAsc">По алфавиту (А-Я)</option>
                <option value="ratingDesc">По моей оценке (сначала высокие)</option>
                <option value="yearDesc">По году (новые)</option>
            </select>
        </div>

        <div class="filters" id="categoryFilters">
            <button class="filter-btn active" data-category="Всё">Всё</button>
            <button class="filter-btn" data-category="Фильм">Фильмы</button>
            <button class="filter-btn" data-category="Сериал">Сериалы</button>
            <button class="filter-btn" data-category="Аниме">Аниме</button>
            <button class="filter-btn" data-category="Манга">Манга</button>
            <button class="filter-btn" data-category="Манхва">Манхва</button>
            <button class="filter-btn" data-category="Ранобэ">Ранобэ</button>
            <button class="filter-btn" data-category="Мультфильм">Мультфильмы</button>
        </div>

        <div class="grid" id="itemsGrid" style="margin-top: 20px;"></div>
    </div>

    <!-- МОДАЛКА ДОБАВЛЕНИЯ / РЕДАКТИРОВАНИЯ -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3 id="modalFormTitle" style="margin: 0;">Добавить тайтл</h3>
            <input type="hidden" id="editId">
            
            <input type="text" id="inputTitle" placeholder="Название (обязательно)*">
            
            <div style="display: flex; gap: 10px;">
                <select id="inputCategory" style="flex: 1;">
                    <option value="Фильм">Фильм</option>
                    <option value="Сериал">Сериал</option>
                    <option value="Аниме">Аниме</option>
                    <option value="Манга">Манга</option>
                    <option value="Манхва">Манхва</option>
                    <option value="Ранобэ">Ранобэ</option>
                    <option value="Мультфильм">Мультфильм</option>
                </select>
                
                <select id="inputStatus" style="flex: 1;">
                    <option value="В планах">В планах</option>
                    <option value="Смотрю/Читаю">Смотрю/Читаю</option>
                    <option value="Просмотрено/Прочитано">Просмотрено/Прочитано</option>
                    <option value="Любимое">Любимое</option>
                    <option value="Пересматриваю">Пересматриваю</option>
                    <option value="Брошено">Брошено</option>
                </select>
            </div>
            
            <input type="text" id="inputPoster" placeholder="Ссылка на постер (URL)">
            
            <div style="display: flex; gap: 10px;">
                <input type="number" id="inputYear" placeholder="Год (1900-2100)" min="1900" max="2100" style="flex: 1;">
                <input type="number" id="inputRating" placeholder="Моя оценка (1-10)" min="1" max="10" step="1" style="flex: 1;">
            </div>
            
            <input type="number" id="inputExtRating" placeholder="Оценка Shikimori/IMDb (напр. 8.54)" min="0" max="10" step="0.01">
            <textarea id="inputDescription" placeholder="Синопсис / Описание..."></textarea>
            
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="closeAddBtn" type="button">Отмена</button>
                <button class="btn" id="saveItemBtn" type="button">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПОДРОБНОСТЕЙ -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <img id="detailPoster" src="" alt="Постер">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <div class="status" id="detailStatus" style="margin: 0;"></div>
                <div class="meta" id="detailMeta" style="margin: 0;"></div>
            </div>
            <h2 id="detailTitle" style="margin: 10px 0;"></h2>
            <div class="ratings" id="detailRating" style="font-size: 15px;"></div>
            <div id="detailDescription"></div>
            
            <div class="modal-buttons" style="justify-content: space-between; margin-top: 15px;">
                <button class="btn btn-danger" id="deleteItemBtn">Удалить</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" id="editItemBtn">Редактировать</button>
                    <button class="btn btn-secondary" id="closeDetailBtn">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <!-- СКРИПТЫ FIREBASE И ЛОГИКА -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCBBC6gBLvCV7Jx1C8NaMheXwqqKPvpnt8",
            authDomain: "mymediatracker-6e179.firebaseapp.com",
            projectId: "mymediatracker-6e179",
            storageBucket: "mymediatracker-6e179.firebasestorage.app",
            messagingSenderId: "642718397694",
            appId: "1:642718397694:web:7a4e175ed593cc364961af",
            measurementId: "G-NKNYFSP981"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let collectionData = [];
        let activeCategory = 'Всё';
        let currentDetailId = null;

        const fallbackSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280"><rect width="200" height="280" fill="%232c2c2c"/><text x="50%" y="50%" fill="%23777" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle">Нет постера</text></svg>';

        // DOM элементы
        const authScreen = document.getElementById('authScreen');
        const appScreen = document.getElementById('appScreen');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userEmailSpan = document.getElementById('userEmail');
        
        const grid = document.getElementById('itemsGrid');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const sortSelect = document.getElementById('sortSelect');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        const addModal = document.getElementById('addModal');
        const detailModal = document.getElementById('detailModal');

        // Авторизация
        loginBtn.onclick = () => {
            signInWithPopup(auth, provider).catch((error) => {
                alert("Ошибка входа: " + error.message);
            });
        };

        logoutBtn.onclick = () => {
            signOut(auth);
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                authScreen.style.display = 'none';
                appScreen.style.display = 'block';
                userEmailSpan.textContent = user.email;
                await loadUserData();
            } else {
                currentUser = null;
                appScreen.style.display = 'none';
                authScreen.style.display = 'flex';
                collectionData = [];
            }
        });

        // Загрузка данных из Firestore
        async function loadUserData() {
            try {
                const q = query(collection(db, "items"), where("userId", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);
                collectionData = [];
                querySnapshot.forEach((docSnap) => {
                    collectionData.push(docSnap.data());
                });
                renderCards();
            } catch (err) {
                console.error("Ошибка загрузки данных:", err);
            }
        }

        // Сохранение элемента в Firestore
        async function saveItemToCloud(item) {
            try {
                await setDoc(doc(db, "items", String(item.id)), {
                    ...item,
                    userId: currentUser.uid
                });
            } catch (err) {
                console.error("Ошибка сохранения:", err);
                alert("Не удалось сохранить в облако.");
            }
        }

        // Удаление элемента из Firestore
        async function deleteItemFromCloud(id) {
            try {
                await deleteDoc(doc(db, "items", String(id)));
            } catch (err) {
                console.error("Ошибка удаления:", err);
            }
        }

        // Отрисовка
        function renderCards() {
            grid.innerHTML = '';
            const searchTerm = searchInput.value.toLowerCase();
            const activeStatus = statusFilter.value;
            const sortMethod = sortSelect.value;

            let filtered = collectionData.filter(item => {
                const matchSearch = item.title.toLowerCase().includes(searchTerm);
                const matchCat = activeCategory === 'Всё' || item.category === activeCategory;
                const matchStatus = activeStatus === 'Все' || item.status === activeStatus;
                return matchSearch && matchCat && matchStatus;
            });

            filtered.sort((a, b) => {
                if (sortMethod === 'dateDesc') return b.id - a.id;
                if (sortMethod === 'dateAsc') return a.id - b.id;
                if (sortMethod === 'titleAsc') return a.title.localeCompare(b.title);
                if (sortMethod === 'yearDesc') return (b.year || 0) - (a.year || 0);
                if (sortMethod === 'ratingDesc') return (b.rating || 0) - (a.rating || 0);
                return 0;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="color: #777; grid-column: 1 / -1;">Ничего не найдено.</div>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openDetailModal(item.id);

                const finalImg = item.poster ? item.poster : fallbackSvg;
                const myRate = item.rating ? `${item.rating}/10` : '-';
                const extRate = item.extRating ? ` | Внешняя: ${item.extRating}` : '';

                const posterCont = document.createElement('div');
                posterCont.className = 'poster-container';
                const img = document.createElement('img');
                img.className = 'poster';
                img.src = finalImg;
                img.onerror = function() { this.src = fallbackSvg; };
                posterCont.appendChild(img);

                const info = document.createElement('div');
                info.className = 'card-info';

                const statusDiv = document.createElement('div');
                statusDiv.className = 'status';
                statusDiv.textContent = item.status;

                const titleH3 = document.createElement('h3');
                titleH3.className = 'title';
                titleH3.textContent = item.title;

                const metaDiv = document.createElement('div');
                metaDiv.className = 'meta';
                metaDiv.textContent = `${item.category} • ${item.year || 'Год не указан'}`;

                const ratingDiv = document.createElement('div');
                ratingDiv.className = 'ratings';
                ratingDiv.textContent = `★ Моя: ${myRate}${extRate}`;

                info.append(statusDiv, titleH3, metaDiv, ratingDiv);
                card.append(posterCont, info);
                grid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', renderCards);
        statusFilter.addEventListener('change', renderCards);
        sortSelect.addEventListener('change', renderCards);

        filterBtns.forEach(btn => {
            btn.onclick = () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCategory = btn.dataset.category;
                renderCards();
            };
        });

        // Модалки
        function openAddModal(isEdit = false, item = null) {
            document.getElementById('modalFormTitle').textContent = isEdit ? 'Редактировать тайтл' : 'Добавить тайтл';
            if (isEdit && item) {
                document.getElementById('editId').value = item.id;
                document.getElementById('inputTitle').value = item.title;
                document.getElementById('inputCategory').value = item.category;
                document.getElementById('inputStatus').value = item.status;
                document.getElementById('inputPoster').value = item.poster;
                document.getElementById('inputYear').value = item.year;
                document.getElementById('inputRating').value = item.rating;
                document.getElementById('inputExtRating').value = item.extRating || '';
                document.getElementById('inputDescription').value = item.description;
            } else {
                document.getElementById('editId').value = '';
                document.getElementById('inputTitle').value = '';
                document.getElementById('inputPoster').value = '';
                document.getElementById('inputYear').value = '';
                document.getElementById('inputRating').value = '';
                document.getElementById('inputExtRating').value = '';
                document.getElementById('inputDescription').value = '';
            }
            addModal.style.display = 'flex';
        }

        function closeModals() {
            addModal.style.display = 'none';
            detailModal.style.display = 'none';
        }

        document.getElementById('openModalBtn').onclick = () => openAddModal(false);
        document.getElementById('closeAddBtn').onclick = closeModals;
        document.getElementById('closeDetailBtn').onclick = closeModals;

        window.onclick = (e) => {
            if (e.target === addModal || e.target === detailModal) closeModals();
        };
        window.onkeydown = (e) => {
            if (e.key === 'Escape') closeModals();
        };

        // Сохранение
        document.getElementById('saveItemBtn').onclick = async () => {
            const titleVal = document.getElementById('inputTitle').value.trim();
            const yearVal = document.getElementById('inputYear').value;
            const editId = document.getElementById('editId').value;

            if (!titleVal) return alert("Название обязательно!");
            if (yearVal && (yearVal < 1900 || yearVal > 2100)) return alert("Год должен быть между 1900 и 2100");

            const itemData = {
                id: editId ? Number(editId) : Date.now(),
                title: titleVal,
                category: document.getElementById('inputCategory').value,
                status: document.getElementById('inputStatus').value,
                poster: document.getElementById('inputPoster').value.trim(),
                year: yearVal,
                rating: document.getElementById('inputRating').value,
                extRating: document.getElementById('inputExtRating').value,
                description: document.getElementById('inputDescription').value.trim()
            };

            if (editId) {
                const index = collectionData.findIndex(i => i.id === Number(editId));
                if (index > -1) collectionData[index] = itemData;
            } else {
                collectionData.push(itemData);
            }

            await saveItemToCloud(itemData);
            renderCards();
            closeModals();
            if(editId) openDetailModal(itemData.id);
        };

        function openDetailModal(id) {
            const item = collectionData.find(i => i.id === id);
            if (!item) return;
            currentDetailId = id;

            document.getElementById('detailPoster').src = item.poster ? item.poster : fallbackSvg;
            document.getElementById('detailTitle').textContent = item.title;
            document.getElementById('detailStatus').textContent = item.status;
            document.getElementById('detailMeta').textContent = `${item.category} • ${item.year || 'Год не указан'}`;
            
            const myRate = item.rating ? `${item.rating}/10` : '-/10';
            const extRate = item.extRating ? ` | Внешняя оценка: ${item.extRating}` : '';
            document.getElementById('detailRating').textContent = `★ Моя оценка: ${myRate}${extRate}`;
            
            document.getElementById('detailDescription').textContent = item.description || 'Описание отсутствует.';
            detailModal.style.display = 'flex';
        }

        document.getElementById('editItemBtn').onclick = () => {
            const item = collectionData.find(i => i.id === currentDetailId);
            if (item) {
                closeModals();
                openAddModal(true, item);
            }
        };

        document.getElementById('deleteItemBtn').onclick = async () => {
            if (confirm('Точно удалить этот тайтл из коллекции?')) {
                await deleteItemFromCloud(currentDetailId);
                collectionData = collectionData.filter(i => i.id !== currentDetailId);
                closeModals();
                renderCards();
            }
        };

        // Бэкапы
        window.exportData = function() {
            if (collectionData.length === 0) return alert("Коллекция пуста, нечего скачивать.");
            const dataStr = JSON.stringify(collectionData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = `MediaTracker_Backup_${new Date().toLocaleDateString()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        window.importData = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        for (let item of importedData) {
                            collectionData.push(item);
                            await saveItemToCloud(item);
                        }
                        renderCards();
                        alert("Бэкап успешно загружен и сохранен в облако!");
                    } else {
                        alert("Ошибка: файл имеет неверный формат.");
                    }
                } catch (err) {
                    alert("Ошибка чтения файла JSON.");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
